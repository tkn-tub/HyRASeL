[Config Baseline]
network = HyraselNetwork

# Network participants
**.numAnchors = 4
**.numNodes = 9


# Adding Randomness to Anchor Position
**.anchor[*].mobility.typename = "SuperpositioningMobility"
**.anchor[*].mobility.numElements = 2

# Placing the anchors in a grid
**.anchor[*].mobility.element[0].typename = "StaticGridMobility"
**.anchor[*].mobility.element[0].subjectModule = "^.^"
**.anchor[*].mobility.element[0].columns = 2
**.anchor[*].mobility.element[0].numHosts = 4 # HARDCODED: Needs to be changed if dynamic
**.anchor[*].mobility.element[0].separationX = 270m
**.anchor[*].mobility.element[0].separationY = 270m
**.anchor[*].mobility.element[0].constraintAreaMinX = 100m
**.anchor[*].mobility.element[0].constraintAreaMaxX = 1000m
**.anchor[*].mobility.element[0].constraintAreaMinY = 100m
**.anchor[*].mobility.element[0].constraintAreaMaxY = 1000m

# Adding second mobility to add randomness to anchor placement
**.anchor[*].mobility.element[1].typename = "LinearMobility"
**.anchor[*].mobility.element[1].constraintAreaMinX = -500m
**.anchor[*].mobility.element[1].constraintAreaMaxX = 1000m
**.anchor[*].mobility.element[1].constraintAreaMinY = -500m
**.anchor[*].mobility.element[1].constraintAreaMaxY = 1000m
**.anchor[*].mobility.element[1].speed = 0mps

**.anchor[*].mobility.element[1].initialX = uniform(-13.5m, 13.5m)
**.anchor[*].mobility.element[1].initialY = uniform(-13.5m, 13.5m)

# Node Mobility
**.node[*].mobility.typename = "MassMobility"
**.node[*].mobility.initialMovementHeading = 90deg 		# Moving towards south
**.node[*].mobility.changeInterval = truncnormal(2s, 0.5s) # changing direction and speed every ~2s
**.node[*].mobility.angleDelta = normal(0deg, 4deg) 	# Direction changes +- 4 degrees per change 
**.node[*].mobility.constraintAreaMinX = -100m			
**.node[*].mobility.constraintAreaMaxX = 500m
**.node[*].mobility.constraintAreaMinY = -100m
**.node[*].mobility.constraintAreaMaxY = 1000m


# Set deployment zone to 80% of the inter-anchor-distance/centered deployment zone with 0.1d margin to each side
# Statically set box between anchors in standard scenario
**.node[*].mobility.initialX = uniform(262m, 478m) 
**.node[*].mobility.initialY = uniform(127m, 343m) 
**.node[*].mobility.initialZ = 0m

# Varying speed with mean 10mps and +- 20%
**.node[*].mobility.speed = truncnormal(25mps, 5mps)
**.node[*].mobility.updateDisplayString = true


#######################################
#      ____                      _ 
#     / ___| _ __   ___  ___  __| |
