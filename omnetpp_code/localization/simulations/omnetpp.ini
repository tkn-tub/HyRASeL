[General]

# Time in which the devices move from top to bottom
sim-time-limit = 10.8s 
repeat = 20

# Statistics Recording not necessary; we write to our csv
**.statistic-recording = false
**.param-recording = false
**.scalar-recording = false
record-scalar-results = false

# RNG Settings
num-rngs = 2
seed-set = ${repetition}
**.mobility.rng-0 = 1
**.mobility.initFromDisplayString = false

# Global ARP
**.arp.typename = "GlobalArp"


# -- App Setup --------------------------------------------------------------

# Set StartTime (immediately)
**.app.startTime = 0s

# Set nodeIds 
**.anchor[*].app.nodeId = parent.index +1
**.node[*].app.nodeId = parent.index + numAnchors + 1

**.anchor[*].app.isAnchor = true
**.node[*].app.isAnchor = false

# Set Clock Settings
**.app.clockModule = "^.clock"
**.clock.oscillator.driftRate = uniform(-20ppm, 20ppm)
**.useClockTime = false

# Set Method and Parameter. NOTE: RANDOM = Centralized; DISTRIBUTED = Distributed
**.app.method = ${Method="DISTRIBUTED", "CENTRALIZED", "TWR", "HYPERBOLIC_SELF_LOCALIZATION"}

**.numVAnchorSlots = 2


# -- Radio Setup ----------------------------------------------------------------

# :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::
# UWB-IR Mimicry Configuration (IEEE 802.15.4a, DW1000, Channel 1)
# Model: ApskScalarRadio with BPSK as abstraction of a coherent UWB receiver
# Range: 230m (succeeds), 250m (fails)
# Created with Claude AI
# :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::
# Simple Own MAC

**.wlan*.typename = "WirelessInterface"
**.wlan*.mac.typename = "SimpleMac"
**.wlan*.queue.typename = "DropTailQueue"
**.energySourceModule = "IdealEpEnergyStorage"

# -- Radio Medium --------------------------------------------------------------
**.radioMedium.typename              = "ApskScalarRadioMedium"
**.radioMedium.pathLoss.typename     = "FreeSpacePathLoss"          # Outdoor LOS, path loss exponent = 2
**.radioMedium.backgroundNoise.power = -82dBm                       # N = -174 + 10·log10(499.2MHz) + 5dB noise figure

# -- Transmitter ---------------------------------------------------------------
**.wlan*.radio.typename                     = "ApskScalarRadio"
**.wlan*.radio.centerFrequency              = 3494.4MHz              # 802.15.4a Channel 1 (Band 1)
**.wlan*.radio.bandwidth                    = 499.2MHz               # 802.15.4a standard channel bandwidth
**.wlan*.radio.transmitter.modulation       = "BPSK"                 # Most robust modulation, default DW1000 mode
**.wlan*.radio.transmitter.bitrate          = 110kbps                # DW1000 low-rate mode for maximum range
**.wlan*.radio.transmitter.power            = -14.3dBm               # 2.24 mW, FCC-compliant UWB outdoor TX limit
**.wlan*.radio.transmitter.preambleDuration = 1024*1018ns + 64*1018ns  # PRE1024 + SFD64 at PRF 64MHz
**.wlan*.radio.transmitter.headerLength     = 19b + 13b              # DW1000 PHR (19b) + application-specific header (Must be divisible by 8)
**.t_tx_msg= 1762129ns												 # Required for calculating slot duration

# -- Receiver ------------------------------------------------------------------
**.wlan*.radio.receiver.errorModel.typename = "ApskErrorModel"   	 # Theoretical BPSK BER curve
**.wlan*.radio.receiver.energyDetection     = -80dBm                 # 2dB above noise floor; UWB has no CSMA, set only to prevent init crash
**.wlan*.radio.receiver.sensitivity         = -105.0dBm              # Hard cutoff: FSPL(250m at 3494MHz) = 91.3dB → -14.3-91.3 = -105.6dBm
**.wlan*.radio.receiver.snirThreshold       = -56dB                  # BPSK minimum (-20.9dB) minus correlation gain PRE1024/PRF64 (35dB)

# -- Modelling Assumptions -----------------------------------------------------
# Sensitivity -106dBm models a coherent correlating receiver (DW1000):
#   Non-coherent thermal limit:       -82 dBm
#   Correlation gain PRE1024/PRF64:   +35 dB = 10·log10(1024) + 5dB PRF bonus
#   Theoretical maximum:              -117 dBm → -106 dBm is conservative
# snirThreshold does not act as range cutoff (sensitivity dominates),
#   but correctly models the effective decoding threshold of the correlator
# PHY impairments (clock drift, multipath, NLOS bias) are applied in post-processing



