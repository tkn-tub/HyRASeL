#######################################
[Config Speed]
extends = Baseline
# Varying speed +-20%
.speed = ${speed =  2, 5, 10, 25, 50} #
**.node[*].mobility.speed = truncnormal(${speed}mps, 0.2*${speed}mps)
sim-time-limit = 270s/${speed} 




