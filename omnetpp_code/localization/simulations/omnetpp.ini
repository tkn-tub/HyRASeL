[Config NodeDensity]
extends = Baseline
# Not including Hyperbolic Self-Localization as in a sparse scenario, it will not work
constraint = ($Method == "DISTRIBUTED" || $Method == "CENTRALIZED" || $Method == "TWR")

#**.node[*].mobility.initialX = uniform(325m - ${size=250, 200, 150, 100}m / 2, 325m + ${size}m / 2)
#**.node[*].mobility.initialY = uniform(125m - ${size}m / 2, 125m + ${size}m / 2)


.size = ${size=80, 60, 40, 20} # In %

**.node[*].mobility.initialX =  uniform(100m + (0.5+((1-((${size})/100))/2)) * 270m, 100m + (0.5+(1-((1-((${size})/100))/2))) * 270m)
**.node[*].mobility.initialY = 	uniform(100m + (0.5-(((${size})/100)/2)) * 270m, 100m + (0.5+(((${size})/100)/2)) * 270m)





