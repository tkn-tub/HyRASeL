[Config AnchorDensity]
extends = Baseline

# Varying Inter-Anchor-Distance to simulate dense, semi-dense and sparse configurations
**.anchor[*].mobility.element[0].separationX = ${interAnchorDist =  130, 200, 270}m
**.anchor[*].mobility.element[0].separationY = ${interAnchorDist}m

# Starting Position varies by 5% of inter-anchor-distance, which introduces randomness but maintains set density
**.anchor[*].mobility.element[1].initialX = uniform(-0.05, 0.05) * ${interAnchorDist}m
**.anchor[*].mobility.element[1].initialY = uniform(-0.05, 0.05) * ${interAnchorDist}m

# Node Deployment Zone fills 80% of the distance between anchors the anchors and starts centered between the northern anchors 
**.node[*].mobility.initialX =  uniform(100m + (0.5+0.1) * ${interAnchorDist}m, 100m + (0.5+0.9) * ${interAnchorDist}m)
**.node[*].mobility.initialY = 	uniform(100m + (0.5-0.4) * ${interAnchorDist}m, 100m + (0.5+0.4) * ${interAnchorDist}m)

# Simulation Time Consistency (Relative position between nodes and anchors
# average speed: 10 mps; distance to travel: 1 interAnchorDist: 
sim-time-limit =  ${interAnchorDist}s/25


