# Effect of the number of t-anchor slots per sequence (only HyRASeL uses them).
methods: [CENTRALIZED]
sweep:
  numSlots: [2, 3, 4, 5, 6]
plots:
  defaults:
    # Half column width: both figures next to each other in one column of the paper.
    width: 0.5
  figures:
    coverage:
      type: line
      metric: mean_coverage
    error:
      type: line
      metric: mean_error
